[workspace]
resolver = "2"
members = [
    "crates/life-interface",
    "crates/life-world",
    "crates/life-agent",
    "crates/life-trace",
    "crates/life-run",
    "crates/life-lab",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
serde_json = "1"

[profile.release]
opt-level = 3
debug = 1
